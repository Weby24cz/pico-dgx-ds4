# The fleet: this cluster's four DGX Sparks in the switchless ring, how they are cabled and
# addressed, and where each keeps its files. Format and keys: fleet/homelab.conf (upstream's own,
# with the key table in README.md, "How to use") and docs/ring.md. Values have no spaces or quotes.
#
# This file is the Weby24cz fork's own, written for a straight-cabled ring: every cable joins the
# same port letter at both ends (p0-p0 and p1-p1 per cable, two rails each), so a rank's
# next-facing port alternates f0/f1/f0/f1 down the ring. Upstream's crossed cabling (f0 of rank r
# to f1 of rank r+1) needs no per-rank device lines; this cabling does — RANK<r>_NEXT_DEV<d> and
# RANK<r>_PREV_DEV<d> override the fleet-wide names, a patch this fork carries
# (engine/comm/fleet.cpp, ring.cpp). Ring order is the TensorFold kits' rank order:
# spark1 (rank 0, the API) -> spark2 -> spark3 -> spark4 -> spark1.
#
# Cabling and addresses: /home/pavelkubicek/cluster/README.md ("Cable", "Wiring And IP Diagram").
# Domain 0 is PCI domain 0 (rocep1s0f*), domain 1 is PCI domain 2 (roceP2p1s0f*); the two domains
# are one connector's two rails, each rail its own /24. GID 3 is the RoCE v2 GID of each rail's
# IPv4 address (checked: 0000:...:ffff:c0a8:... on every device, index 3).

NEXT_DEV0=rocep1s0f0
NEXT_DEV1=roceP2p1s0f0
PREV_DEV0=rocep1s0f1
PREV_DEV1=roceP2p1s0f1
GID_INDEX=3

BIN_DIR=~/dsgb10/bin
LOG_DIR=~/dsgb10/logs
SERVICE_DIR=~/dsgb10/service
RING_LOCK=~/dsgb10/ring.lock

# Rank 0: spark1, the head. Next-facing ports are its f0 (to spark2), previous-facing its f1
# (from spark4): the global device names above hold.
RANK0_NAME=spark1
RANK0_HOSTNAME=spark1.lan
RANK0_NEXT_IP0=192.168.100.10
RANK0_NEXT_IP1=192.168.101.10
RANK0_PREV_IP0=192.168.106.10
RANK0_PREV_IP1=192.168.107.10
RANK0_WEIGHTS=~/dsgb10/weights/rank0.dsw
RANK0_HASHMAP=~/dsgb10/engram/engram_hashmap.bin
RANK0_ENGRAM=~/dsgb10/engram
RANK0_SPILL=~/dsgb10/spill

# Rank 1: spark2. Straight cable to spark3 joins f1 at both ends, so its next-facing port is f1
# and its previous-facing port is f0: the two override lines per domain.
RANK1_NAME=spark2
RANK1_HOSTNAME=spark2.lan
RANK1_SSH=pavelkubicek@spark2.lan
RANK1_NEXT_DEV0=rocep1s0f1
RANK1_NEXT_DEV1=roceP2p1s0f1
RANK1_PREV_DEV0=rocep1s0f0
RANK1_PREV_DEV1=roceP2p1s0f0
RANK1_NEXT_IP0=192.168.102.11
RANK1_NEXT_IP1=192.168.103.11
RANK1_PREV_IP0=192.168.100.11
RANK1_PREV_IP1=192.168.101.11
RANK1_WEIGHTS=~/dsgb10/weights/rank1.dsw
RANK1_HASHMAP=~/dsgb10/engram/engram_hashmap.bin
RANK1_ENGRAM=~/dsgb10/engram
RANK1_SPILL=~/dsgb10/spill

# Rank 2: spark3. Like rank 0: next-facing f0 (to spark4), previous-facing f1 (from spark2).
RANK2_NAME=spark3
RANK2_HOSTNAME=spark3.lan
RANK2_SSH=pavelkubicek@spark3.lan
RANK2_NEXT_DEV0=rocep1s0f0
RANK2_NEXT_DEV1=roceP2p1s0f0
RANK2_PREV_DEV0=rocep1s0f1
RANK2_PREV_DEV1=roceP2p1s0f1
RANK2_NEXT_IP0=192.168.104.12
RANK2_NEXT_IP1=192.168.105.12
RANK2_PREV_IP0=192.168.102.12
RANK2_PREV_IP1=192.168.103.12
RANK2_WEIGHTS=~/dsgb10/weights/rank2.dsw
RANK2_HASHMAP=~/dsgb10/engram/engram_hashmap.bin
RANK2_ENGRAM=~/dsgb10/engram
RANK2_SPILL=~/dsgb10/spill

# Rank 3: spark4. Like rank 1: next-facing f1 (to spark1), previous-facing f0 (from spark3).
RANK3_NAME=spark4
RANK3_HOSTNAME=spark4.lan
RANK3_SSH=pavelkubicek@spark4.lan
RANK3_NEXT_DEV0=rocep1s0f1
RANK3_NEXT_DEV1=roceP2p1s0f1
RANK3_PREV_DEV0=rocep1s0f0
RANK3_PREV_DEV1=roceP2p1s0f0
RANK3_NEXT_IP0=192.168.106.13
RANK3_NEXT_IP1=192.168.107.13
RANK3_PREV_IP0=192.168.104.13
RANK3_PREV_IP1=192.168.105.13
RANK3_WEIGHTS=~/dsgb10/weights/rank3.dsw
RANK3_HASHMAP=~/dsgb10/engram/engram_hashmap.bin
RANK3_ENGRAM=~/dsgb10/engram
RANK3_SPILL=~/dsgb10/spill
